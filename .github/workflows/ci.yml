name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.S3_BUCKET != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # lets GitHub sign the OIDC token AWS trades for short-lived credentials
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload site
        run: |
          # Hashed build assets never change: cache for a year.
          aws s3 sync build/_app/immutable "s3://${{ vars.S3_BUCKET }}/_app/immutable" \
            --cache-control "public, max-age=31536000, immutable"
          # Everything else (pages, service worker, manifest, fonts) must revalidate so updates reach people.
          aws s3 sync build "s3://${{ vars.S3_BUCKET }}" --delete \
            --exclude "_app/immutable/*" \
            --cache-control "no-cache"
      - name: Invalidate CDN
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
